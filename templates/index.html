<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethio Telegram Ads Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #222; padding-bottom: 70px; }

    /* Header & Top Bar */
    header { background: #fff; border-bottom: 1px solid #e1e4e8; padding: 12px 16px; position: sticky; top: 0; z-index: 100; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: auto; }
    .logo { font-size: 20px; font-weight: 800; color: #0088cc; text-decoration: none; }
    
    /* Language Selector */
    .lang-select { padding: 6px 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; background: #fff; outline: none; }

    /* Catalog Container */
    .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
    .page-title { font-size: 24px; font-weight: 800; margin-bottom: 15px; color: #1e293b; }

    /* Filter & Search Bar */
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-input { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 15px; outline: none; }
    .search-input:focus { border-color: #0088cc; }

    /* Channel Cards (Telega.io Style) */
    .channel-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .channel-icon { width: 50px; height: 50px; border-radius: 50%; background: #0088cc; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
    .ch-title { font-size: 18px; font-weight: 700; color: #0f172a; }
    .ch-link { font-size: 13px; color: #64748b; text-decoration: none; }
    .ch-stats { display: flex; justify-content: space-between; background: #f8fafc; padding: 12px 16px; border-radius: 10px; margin: 12px 0; border: 1px solid #edf2f7; }
    .stat-item { text-align: center; }
    .stat-val { font-size: 16px; font-weight: 700; color: #1e293b; }
    .stat-lbl { font-size: 12px; color: #64748b; }

    .card-action { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .price-tag { font-size: 18px; font-weight: 800; color: #16a34a; }
    .buy-btn { background: #16a34a; color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; border: none; cursor: pointer; transition: 0.2s; }
    .buy-btn:hover { background: #15803d; }

    /* Floating AI Chat Widget */
    .ai-fab { position: fixed; bottom: 25px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; box-shadow: 0 4px 15px rgba(37,99,235,0.4); z-index: 999; }
    .chat-modal { display: none; position: fixed; bottom: 90px; right: 20px; width: 340px; height: 460px; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; z-index: 1000; border: 1px solid #e2e8f0; }
    .chat-header { background: #2563eb; color: #fff; padding: 12px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .chat-close { cursor: pointer; font-size: 18px; }
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; line-height: 1.4; }
    .msg.bot { background: #f1f5f9; align-self: flex-start; color: #1e293b; }
    .msg.user { background: #2563eb; color: #fff; align-self: flex-end; }
    .chat-input-bar { display: flex; border-top: 1px solid #e2e8f0; padding: 8px; gap: 6px; }
    .chat-input-bar input { flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 8px 12px; outline: none; }
    .chat-input-bar button { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="top-bar">
      <a href="/" class="logo">⚡ EthioAd.io</a>
      <select id="langSwitcher" class="lang-select" onchange="switchLanguage()">
        <option value="am">🇪🇹 አማርኛ</option>
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="ar">🇸🇦 العربية</option>
      </select>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title" id="txtTitle">የቴሌግራም ቻናሎች ዝርዝር (Channels Catalog)</h1>
    
    <!-- Search / Filter -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="ቻናል ይፈልጉ (Search channels...)" onkeyup="filterChannels()" />
    </div>

    <!-- Channels Container -->
    <div id="channelsContainer">
      <p style="text-align: center; color: #64748b;">ቻናሎች በመጫን ላይ ናቸው...</p>
    </div>
  </div>

  <!-- Floating AI Assistant Button -->
  <div class="ai-fab" onclick="toggleChat()" title="AI Assistant">💬</div>

  <!-- AI Chat Window -->
  <div class="chat-modal" id="chatModal">
    <div class="chat-header">
      <span>🤖 Gemini AI Assistant</span>
      <span class="chat-close" onclick="toggleChat()">✕</span>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="msg bot" id="aiWelcome">ሰላም! ስለ ቻናሎች ወይም ማስታወቂያ አሰራር ማንኛውንም ጥያቄ ይጠይቁኝ።</div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="aiQuery" placeholder="ጥያቄዎን ይጻፉ..." onkeypress="if(event.key==='Enter') sendAiMessage()" />
      <button onclick="sendAiMessage()">ላክ</button>
    </div>
  </div>

  <script>
    let allChannels = [];

    // ቋንቋ መቀያየሪያ
    const translations = {
      am: {
        title: "የቴሌግራም ቻናሎች ዝርዝር (Channels Catalog)",
        searchPlaceholder: "ቻናል ይፈልጉ (Search channels...)",
        views: "እይታ (Views)",
        priceFrom: "ዋጋ ከመነሻው፦",
        buy: "ማስታወቂያ ይግዙ ➔",
        aiWelcome: "ሰላም! ስለ ቻናሎች ወይም ማስታወቂያ አሰራር ማንኛውንም ጥያቄ ይጠይቁኝ።",
        inputPlaceholder: "ጥያቄዎን ይጻፉ..."
      },
      en: {
        title: "Telegram Channels Catalog",
        searchPlaceholder: "Search channels...",
        views: "Views",
        priceFrom: "Starting at:",
        buy: "Buy Ad ➔",
        aiWelcome: "Hello! Ask me any question regarding channels or buying ads.",
        inputPlaceholder: "Type your question..."
      },
      fr: {
        title: "Catalogue des chaînes Telegram",
        searchPlaceholder: "Rechercher des chaînes...",
        views: "Vues",
        priceFrom: "À partir de:",
        buy: "Acheter pub ➔",
        aiWelcome: "Bonjour! Posez vos questions sur la publicité et les chaînes.",
        inputPlaceholder: "Écrivez votre message..."
      },
      ar: {
        title: "دليل قنوات التيليجرام",
        searchPlaceholder: "ابحث عن القنوات...",
        views: "المشاهدات",
        priceFrom: "يبدأ من:",
        buy: "شراء إعلان ➔",
        aiWelcome: "مرحباً! اسأل المساعد الذكي عن أي استفسار يخص الإعلانات.",
        inputPlaceholder: "اكتب سؤالك..."
      }
    };

    function switchLanguage() {
      const l = document.getElementById('langSwitcher').value;
      const t = translations[l] || translations.en;
      document.getElementById('txtTitle').innerText = t.title;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('aiWelcome').innerText = t.aiWelcome;
      document.getElementById('aiQuery').placeholder = t.inputPlaceholder;
      renderChannels(allChannels);
    }

    // ዳታቤዝ ውስጥ ያሉ ቻናሎችን መጫን
    async function loadChannels() {
      try {
        const res = await fetch('/api/channels');
        allChannels = await res.json();
        renderChannels(allChannels);
      } catch (e) {
        document.getElementById('channelsContainer').innerHTML = "<p style='color:red; text-align:center;'>ቻናሎችን መጫን አልተቻለም።</p>";
      }
    }

    function renderChannels(channels) {
      const container = document.getElementById('channelsContainer');
      const l = document.getElementById('langSwitcher').value;
      const t = translations[l] || translations.en;

      if (!channels || channels.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#64748b;'>ምንም የተመዘገበ ቻናል የለም።</p>";
        return;
      }

      container.innerHTML = channels.map(ch => `
        <div class="channel-card">
          <div class="card-header">
            <div class="channel-icon">${ch.channel_name.charAt(0).toUpperCase()}</div>
            <div>
              <div class="ch-title">${ch.channel_name}</div>
              <a href="${ch.channel_link}" target="_blank" class="ch-link">${ch.channel_link}</a>
            </div>
          </div>
          <div class="ch-stats">
            <div class="stat-item">
              <div class="stat-val">Active</div>
              <div class="stat-lbl">Status</div>
            </div>
            <div class="stat-item">
              <div class="stat-val">5K - 50K</div>
              <div class="stat-lbl">${t.views}</div>
            </div>
          </div>
          <div class="card-action">
            <div>
              <span style="font-size:12px; color:#64748b;">${t.priceFrom}</span>
              <div class="price-tag">${ch.final_price} ETB</div>
            </div>
            <a href="https://t.me/EthioAdvert_bot?start=buy_${ch.id}" target="_blank" class="buy-btn">${t.buy}</a>
          </div>
        </div>
      `).join('');
    }

    function filterChannels() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allChannels.filter(c => c.channel_name.toLowerCase().includes(q));
      renderChannels(filtered);
    }

    // AI Chat Widget ተግባራት
    function toggleChat() {
      const modal = document.getElementById('chatModal');
      modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
    }

    async function sendAiMessage() {
      const input = document.getElementById('aiQuery');
      const query = input.value.trim();
      if (!query) return;

      const msgs = document.getElementById('chatMessages');
      msgs.innerHTML += `<div class="msg user">${query}</div>`;
      input.value = '';
      msgs.scrollTop = msgs.scrollHeight;

      const lang = document.getElementById('langSwitcher').value;

      try {
        const res = await fetch('/api/ask_ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, lang: lang })
        });
        const data = await res.json();
        msgs.innerHTML += `<div class="msg bot">${data.reply}</div>`;
      } catch (e) {
        msgs.innerHTML += `<div class="msg bot">ይቅርታ፣ ችግር ተፈጥሯል፤ እባክዎ እንደገና ይሞክሩ።</div>`;
      }
      msgs.scrollTop = msgs.scrollHeight;
    }

    loadChannels();
  </script>
</body>
</html>
